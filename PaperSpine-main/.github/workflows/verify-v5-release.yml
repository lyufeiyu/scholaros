name: Verify PaperSpine5 release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: true
        default: v0.4.0-alpha.1-dev
  release:
    types: [published, prereleased]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify committed release metadata
        run: python paperspine5/release_tools/verify_release.py
      - name: Download immutable public assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release download "$RELEASE_TAG" --dir public-assets
      - name: Verify public package checksums
        working-directory: public-assets
        run: sha256sum --check checksums.sha256
